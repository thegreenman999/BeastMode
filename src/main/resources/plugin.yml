name: MinkensPVPBeastMode
main: me.thegreenman.Main
version: 1.0
api-version: 1.21
prefix: BM
authors: [minken, thegreenman]
commands:
  start:
    description: Start the game.
    usage: /<command>
    permission: beastmode.start
  minken:
    description: Minkens admin menu.
    usage: /<command>
    permission: beastmode.minken
  addcloak:
    description: Minken testar.
    usage: /<command>
    permission: beastmode.cloak
  fullbright:
    description: toggle fullbright
    usage: /<command>
    aliases:
      - fb
    permission: beastmode.fullbright
  tntbow:
    usage: /<command>
    permission: beastmode.tntbow
  stats:
    usage: /<command>
    permission: beastmode.stats
  bridgeegg:
    usage: /<command>
permissions:
  beastmode.admin.*:
    children:
      beastmode.tntbow.force: true
      beastmode.tntbow.forceothers: true
      beastmode.minken: true
  beastmode.cloak:
    default: true
  beastmode.minken:
    default: op
  beastmode.start:
    default: true
  beastmode.fullbright:
    default: true
  beastmode.tntbow:
    description: gives the TNT bow in the start
    default: op
  beastmode.tntbow.orhers:
    default: op
  beastmode.tntbow.force:
    default: op
  beastmode.tntbow.forceothers:
    default: op
  beastmode.stats:
    default: true
